---
# Same test as the default (Podman) scenario, on Docker: same nodes, sequence,
# playbooks and inventory, all taken from ../default/.
#   molecule test -s docker
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  name: docker

platforms:
  - name: es-1
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    privileged: true          # systemd in the container
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    docker_networks:          # created once, shared by every node
      - name: elasticsearch_molecule
    networks:
      - name: elasticsearch_molecule
    groups: [elasticsearch]

  - name: es-2
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - name: elasticsearch_molecule
    groups: [elasticsearch]

  - name: es-3
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - name: elasticsearch_molecule
    groups: [elasticsearch]

provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    side_effect: ../default/side_effect.yml
    verify: ../default/verify.yml
  inventory:
    links:
      group_vars: ../default/inventory/group_vars/
      host_vars: ../default/inventory/host_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
