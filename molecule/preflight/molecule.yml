---
# Preflight only: each case in converge.yml runs the role's facts and preflight
# tasks with settings that must be refused, and checks the run fails in the
# right task, with the right message, and without printing a secret. Nothing
# is installed, so there is no prepare, idempotence or verify step.
#   molecule test -s preflight
#
# One container is enough. The inventory adds two hosts that are never
# contacted (ghost-2, ghost-3), so cases can point elasticsearch_cluster_group
# at a group without this host, or with three master-eligible nodes.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  name: podman

platforms:
  - name: es-p1
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    groups: [elasticsearch, three_masters]

provisioner:
  name: ansible
  inventory:
    links:
      hosts: inventory/hosts.yml   # ghost-2, ghost-3
      group_vars: inventory/group_vars/

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - destroy
