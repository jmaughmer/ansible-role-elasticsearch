---
# The kvm scenario on AlmaLinux 10 VMs whose /tmp, /var/tmp, /dev/shm and
# /home are mounted noexec, as the DISA STIG has them. Same hosts, playbooks
# and inventory as ../kvm; verify also checks Elasticsearch uses
# elasticsearch_tmp_dir and loaded nothing from a noexec directory.
#   molecule test -s kvm-noexec
role_name_check: 1

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: true

platforms:
  - name: es-1
    image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    image_checksum: sha256:https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
    osinfo: almalinux10
    memory_mb: 3072
    vcpus: 2
    disk_gb: 20
    groups:
      - elasticsearch
      - kvm
  - name: es-2
    image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    image_checksum: sha256:https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
    osinfo: almalinux10
    memory_mb: 3072
    vcpus: 2
    disk_gb: 20
    groups:
      - elasticsearch
      - kvm
  - name: es-3
    image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    image_checksum: sha256:https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
    osinfo: almalinux10
    memory_mb: 3072
    vcpus: 2
    disk_gb: 20
    groups:
      - elasticsearch
      - kvm

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
    ssh_connection:
      pipelining: true
  playbooks:
    create: ../kvm/create.yml
    destroy: ../kvm/destroy.yml
    prepare: prepare.yml
    converge: ../default/converge.yml
    side_effect: ../default/side_effect.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: ../kvm/inventory/group_vars/
      host_vars: ../kvm/inventory/host_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
