---
# Tests run on the Proxmox test lab: three real KVM VMs cloned from the lab
# fleet onto the isolated labnet network (EL release chosen by LAB_TEMPLATE),
# forming a three-node Elasticsearch cluster with SELinux enforcing and
# firewalld running — including cross-node transport TLS verification, which
# containers could never exercise. converge.yml is a wrapper around the repo's
# own examples/playbook.yml; prepare.yml issues the node certificates with
# ansible-role-elastic-tls, as a real deployment does, and the inline
# group_vars feed them to the role by path. Every address comes from gathered
# facts, so nothing here knows a hostname or subnet. All Proxmox connection
# details live in the driver's secrets file on the control machine. The
# driver's SSH lands as a sudo user; the plays' become: true runs the tasks
# privileged through it.
#
# Default VMIDs are the repo's 9300-9302 band, via LAB_VMID_0..2 so the lab's
# `mlab` runner can claim a free band per run and allow parallel runs of this
# repo; a plain molecule test uses the pinned band, one lab run at a time.
# Needs the memory/cores passthrough patch in the molecule-proxmox driver
# (ct-bootstrap.sh re-applies it after pipx upgrades).
#
# Run on the lab's molecule control machine:
#   /root/labnet/mlab test -s default              # parallel-safe, recommended
#   molecule test                                  # pinned band
#   LAB_TEMPLATE=template-alma10 molecule test     # the other EL release
role_name_check: 1

dependency:
  name: galaxy
  enabled: false        # collections preinstalled on the control machine
prerun: false

driver:
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: 300

platforms:
  - name: es-default-1
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_0:-9300}
    groups: [elasticsearch]
    memory: 4096
    cores: 2

  - name: es-default-2
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_1:-9301}
    groups: [elasticsearch]
    memory: 4096
    cores: 2

  - name: es-default-3
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_2:-9302}
    groups: [elasticsearch]
    memory: 4096
    cores: 2

provisioner:
  name: ansible
  env:
    # elastic_tls and the role under test resolve through the sibling role
    # checkouts of this repo.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:/root/.ansible/roles"
  inventory:
    group_vars:
      all:
        test_default_version: >-
          {{ (lookup('ansible.builtin.file',
             lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/defaults/main.yml')
             | from_yaml).elasticsearch_version }}
        # ansible-role-elastic-tls: private CA on the first node, certificates
        # named after the inventory hosts and carrying their addresses.
        elastic_tls_provider: ca
        elastic_tls_ca_common_name: Molecule Test CA
        elastic_tls_ca_passphrase: molecule-test-passphrase
      elasticsearch:
        elasticsearch_cluster_name: molecule-default
        # Labnet DNS does not resolve bare DHCP hostnames, and the seed-host
        # fallback uses inventory names → master_not_discovered. Point the
        # role at addresses (the certificates carry them, so transport TLS
        # verification passes against the IP).
        elasticsearch_discovery_address: "{{ ansible_facts.default_ipv4.address }}"
        # Test-only superuser password, like the other molecule credentials.
        elasticsearch_elastic_password: molecule-lab-password-2026
        # The CA the tls role leaves on every host, consumed by path.
        elasticsearch_ssl_ca_certificate_path: /etc/pki/elastic-tls/certs/ca.crt
        ssl_certificates:
          - name: "{{ inventory_hostname }}"
            certificate:
              path: "/etc/pki/elastic-tls/certs/{{ inventory_hostname }}.crt"
            key:
              path: "/etc/pki/elastic-tls/private/{{ inventory_hostname }}.key"
        elasticsearch_plugins: []
        elasticsearch_license: ""

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
