---
# Runs once, after the VMs are created:
#   - play 1 gets the boxes ansible-ready: the lab templates self-configure
#     labnet DNS since 2026-11-13, but the resolv.conf task cures a DHCP
#     hiccup and the dnf priming keeps a boot-time DNS stall from killing
#     the first metadata fetch;
#   - play 2 issues every node's certificate with ansible-role-elastic-tls,
#     the same way a real deployment does; the role reads them by path
#     (the scenario's group_vars).
# Privilege comes from become: true on each play (the driver's SSH lands as
# a sudo user).
- name: Get the VMs ready for ansible-core
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Wait for SSH to be up after first boot
      ansible.builtin.wait_for_connection:

    # The lab templates enable cloud-init's package_update_upgrade_install, so a
    # fresh clone spends its first minutes running `dnf -y upgrade`. dnf takes its
    # lock only after resolving, so a task that resolves inside that window plans
    # against the pre-upgrade rpmdb and then reaches for an rpm the upgrade has
    # already installed and deleted -- [Errno 2] on a /var/cache/dnf/*/packages
    # path. Seen in ansible-role-bind, where cloud-init was still running three
    # and a half minutes after boot. Wait for it to settle; it owns resolv.conf
    # too.
    - name: Wait for cloud-init to finish its boot-time work
      ansible.builtin.raw: |
        for i in $(seq 1 120); do
          state=$(cloud-init status 2>/dev/null | sed -n 's/^status: //p')
          case "$state" in
            done) exit 0 ;;
            error) echo 'cloud-init reported an error' >&2; exit 1 ;;
          esac
          sleep 5
        done
        echo 'cloud-init still running after 10 minutes' >&2
        exit 1
      changed_when: false

    # The AlmaLinux cloud templates were first booted on the LAN, so they can
    # carry a stale /etc/resolv.conf that EL9's cloud images never update
    # (NM dns=none; cloud-init owns the file). Rewrite it from the lease.
    - name: Point resolv.conf at the labnet DNS from DHCP
      ansible.builtin.raw: |
        gw=$(ip -4 route | awk '/default via/ {print $3; exit}')
        test -n "$gw"
        dns=""
        for d in $(nmcli -t -f IP4.DNS device show eth0 | cut -d: -f2); do
          [ "$d" = "$gw" ] && dns=$d
        done
        printf 'nameserver %s\n' "${dns:-$gw}" > /etc/resolv.conf
      changed_when: true

    # Labnet DNS can hiccup while several VMs boot at once, which used to
    # kill a first dnf call (Curl error 6). Prime name and metadata here with
    # bounded retries; the role's dnf then finds fresh metadata.
    - name: Prime DNS and dnf metadata
      ansible.builtin.raw: >-
        /bin/sh -c "for i in 1 2 3 4 5; do
        if getent hosts mirrors.almalinux.org && dnf -y -q makecache;
        then exit 0; fi; sleep 10; done; exit 1"
      changed_when: false

- name: Issue the certificates
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: elastic_tls
