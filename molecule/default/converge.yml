---
# As examples/playbook.yml: every node in one play, so the role can start a new
# cluster and coordinate restarts across it. The role is included by the
# repository's path, which works whatever the roles path is (newer Molecule
# releases no longer add the project's parent directory to it).
- name: Converge
  hosts: elasticsearch
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
