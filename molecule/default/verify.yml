---
# VM-level checks: every node answers over its own address with the node
# certificate, the cluster is green with the whole fleet, and the package is
# at the version the role defaults promise. run_once on the first node for
# cluster health: any node answers it.
- name: Verify the Elasticsearch cluster
  hosts: elasticsearch
  gather_facts: true
  become: true
  vars:
    test_ca: /etc/elasticsearch/tls/ca.crt
    test_url: "https://{{ ansible_facts.default_ipv4.address }}:9200"
  tasks:
    - name: The node answers over its own HTTPS address
      ansible.builtin.uri:
        url: "{{ test_url }}"
        url_username: elastic
        url_password: "{{ elasticsearch_elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ test_ca }}"
      register: test_root
      until: test_root.status == 200
      retries: 24
      delay: 5

    - name: The node is part of a green cluster with every member
      ansible.builtin.uri:
        url: "{{ test_url }}/_cluster/health?wait_for_status=green&timeout=90s"
        url_username: elastic
        url_password: "{{ elasticsearch_elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ test_ca }}"
      register: test_health
      run_once: true

    - name: Assert the cluster shape
      ansible.builtin.assert:
        that:
          - test_health.json.status == 'green'
          - test_health.json.number_of_nodes == groups['elasticsearch'] | length
          - test_health.json.number_of_data_nodes == groups['elasticsearch'] | length
          - test_health.json.unassigned_shards == 0
        fail_msg: "cluster: {{ test_health.json | default({}) }}"
      run_once: true

    - name: The package is at the role's default version
      ansible.builtin.command: dnf -q list installed elasticsearch
      register: test_package
      changed_when: false
      failed_when: test_default_version not in test_package.stdout
