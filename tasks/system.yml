---
- name: System | Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ elasticsearch_vm_max_map_count }}"
    sysctl_file: /etc/sysctl.d/90-elasticsearch.conf
    reload: true
    state: present
  when: elasticsearch_manage_sysctl | bool

- name: System | Create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: System | Configure systemd drop-in
  ansible.builtin.template:
    src: systemd-override.conf.j2
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  register: _es_systemd_override

- name: System | Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _es_systemd_override is changed

- name: System | Flag restart for systemd changes
  ansible.builtin.set_fact:
    _es_restart_required: true
  when: _es_systemd_override is changed

- name: System | Ensure data, log and temporary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: "2750"
  loop: >-
    {{ [elasticsearch_data_path, elasticsearch_log_path]
       + ([elasticsearch_tmp_dir] if (elasticsearch_tmp_dir | length) > 0 else []) }}

- name: System | Check whether firewalld is running
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: _es_firewalld_state
  changed_when: false
  failed_when: false
  check_mode: false
  when: elasticsearch_manage_firewall | bool

- name: System | Open Elasticsearch ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    zone: "{{ elasticsearch_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ elasticsearch_http_port }}"
    - "{{ elasticsearch_transport_port }}"
  when:
    - elasticsearch_manage_firewall | bool
    - (_es_firewalld_state.stdout | default('') | trim) == 'active'

- name: System | Open additional ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    zone: "{{ elasticsearch_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ elasticsearch_firewall_ports }}"
  when:
    - elasticsearch_manage_firewall | bool
    - (_es_firewalld_state.stdout | default('') | trim) == 'active'

- name: System | Open firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: "{{ elasticsearch_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ elasticsearch_firewall_services }}"
  when:
    - elasticsearch_manage_firewall | bool
    - (_es_firewalld_state.stdout | default('') | trim) == 'active'

# Ubuntu's firewall. Rules are only added while ufw is active, as with firewalld.
- name: System | Check whether ufw is active
  ansible.builtin.command:
    cmd: ufw status
  register: _es_ufw_state
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - elasticsearch_manage_firewall | bool
    - (_es_firewalld_state.stdout | default('') | trim) != 'active'

- name: System | Open Elasticsearch and additional ports in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/') | first | replace('-', ':') }}"
    proto: "{{ item.split('/') | last }}"
    comment: elasticsearch
  loop: "{{ [elasticsearch_http_port ~ '/tcp', elasticsearch_transport_port ~ '/tcp'] + elasticsearch_firewall_ports }}"
  when:
    - elasticsearch_manage_firewall | bool
    - _es_ufw_active | bool

- name: System | Report firewalld services that ufw cannot open
  ansible.builtin.debug:
    msg: >-
      elasticsearch_firewall_services ({{ elasticsearch_firewall_services | join(', ') }}) are firewalld
      service names, which ufw does not know. List their ports in elasticsearch_firewall_ports instead.
  when:
    - elasticsearch_manage_firewall | bool
    - _es_ufw_active | bool
    - elasticsearch_firewall_services | length > 0

- name: System | Report that no firewall is running
  ansible.builtin.debug:
    msg: >-
      elasticsearch_manage_firewall is on but neither firewalld nor ufw is running on {{ inventory_hostname }},
      so no rules were added. Ports {{ elasticsearch_http_port }} and
      {{ elasticsearch_transport_port }} have to be reachable however this host filters traffic.
  when:
    - elasticsearch_manage_firewall | bool
    - (_es_firewalld_state.stdout | default('') | trim) != 'active'
    - not (_es_ufw_active | bool)
