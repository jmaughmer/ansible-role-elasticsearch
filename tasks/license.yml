---
- name: License | Install license
  run_once: true
  vars:
    _es_license_doc: >-
      {{ elasticsearch_license if elasticsearch_license is mapping
         else (elasticsearch_license | string | from_json) }}
    _es_license_body: >-
      {{ {'licenses': _es_license_doc.licenses} if _es_license_doc.licenses is defined
         else {'licenses': [_es_license_doc.license | default(_es_license_doc)]} }}
    _es_license_uid: "{{ _es_license_body.licenses[0].uid | default('') }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: elastic
      url_password: "{{ elasticsearch_elastic_password }}"
      force_basic_auth: true
      ca_path: "{{ _es_api_ca_path }}"
      validate_certs: "{{ elasticsearch_api_validate_certs | bool }}"
      body_format: json
      timeout: "{{ elasticsearch_api_timeout }}"
  block:
    - name: License | Validate license document
      ansible.builtin.assert:
        that:
          - _es_license_uid | length > 0
        fail_msg: elasticsearch_license must be the JSON license file provided by Elastic (missing license uid).
        quiet: true

    - name: License | Read current license
      ansible.builtin.uri:
        url: "{{ _es_api_url }}/_license"
        status_code: [200, 404]
      register: _es_license_current
      until: _es_license_current is not failed
      retries: "{{ elasticsearch_task_retries }}"
      delay: "{{ elasticsearch_task_delay }}"

    - name: License | Apply license
      ansible.builtin.uri:
        url: "{{ _es_api_url }}/_license?acknowledge=true"
        method: PUT
        body: "{{ _es_license_body }}"
      register: _es_license_update
      until: _es_license_update is not failed
      retries: "{{ elasticsearch_task_retries }}"
      delay: "{{ elasticsearch_task_delay }}"
      changed_when: true
      when: (_es_license_current.json.license.uid | default('')) != _es_license_uid
      no_log: "{{ elasticsearch_no_log }}"

    - name: License | Verify license was accepted
      ansible.builtin.assert:
        that:
          - (_es_license_update.json.license_status | default('')) == 'valid'
        fail_msg: "License was rejected: {{ _es_license_update.json | default({}) | to_json }}"
        quiet: true
      when: _es_license_update is changed
