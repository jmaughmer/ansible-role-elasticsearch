---
- name: Keystore | Create keystore if missing
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore create"
    creates: "{{ _es_keystore_path }}"
  register: _es_keystore_create

- name: Keystore | List entries
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore list"
  register: _es_keystore_list
  changed_when: false
  check_mode: false

- name: Keystore | Remove security auto-configuration entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - remove
      - "{{ item }}"
  loop: "{{ _es_autoconfig_keystore_entries | intersect(_es_keystore_list.stdout_lines | map('trim') | list) }}"
  register: _es_keystore_removed

# Only read by a node that has no data yet. Removing it afterwards has no effect
# on a running node, so unlike other keystore changes it does not flag a restart.
- name: Keystore | Remove the bootstrap password once the node has data
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - remove
      - bootstrap.password
  when:
    - _es_has_data | bool
    - "'bootstrap.password' in (_es_keystore_list.stdout_lines | map('trim') | list)"

- name: Keystore | Read current values of managed entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - show
      - "{{ item }}"
  loop: "{{ _es_keystore_desired.keys() | list | intersect(_es_keystore_list.stdout_lines | map('trim') | list) }}"
  register: _es_keystore_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Add or update managed entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - add
      - --force
      - --stdin
      - "{{ item }}"
    stdin: "{{ _es_keystore_desired[item] }}"
    stdin_add_newline: false
  loop: "{{ _es_keystore_desired.keys() | list }}"
  when: >-
    (_es_keystore_current.results | default([])
      | selectattr('item', 'equalto', item)
      | selectattr('rc', 'equalto', 0)
      | selectattr('stdout', 'equalto', _es_keystore_desired[item] | string)
      | list | length) == 0
  register: _es_keystore_updated
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Ensure keystore ownership and permissions
  ansible.builtin.file:
    path: "{{ _es_keystore_path }}"
    owner: root
    group: elasticsearch
    mode: "0660"

- name: Keystore | Flag restart for keystore changes
  ansible.builtin.set_fact:
    _es_restart_required: true
  when: _es_keystore_create is changed or _es_keystore_removed is changed or _es_keystore_updated is changed
