---
- name: Keystore | Create keystore if missing
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore create"
    creates: "{{ _es_keystore_path }}"
  register: _es_keystore_create

# With elasticsearch_keystore_password set, the keystore is password protected
# and every elasticsearch-keystore call reads the password as the first line of
# its standard input.
- name: Keystore | Check whether the keystore has a password
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore has-passwd"
  register: _es_keystore_has_passwd
  changed_when: false
  failed_when: _es_keystore_has_passwd.rc not in [0, 1]
  check_mode: false
  when: not (ansible_check_mode and _es_keystore_create is changed)

- name: Keystore | Try the configured and previous passwords
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore list"
    stdin: "{{ item }}"
  loop: "{{ [elasticsearch_keystore_password, elasticsearch_keystore_previous_password] | map('string') | select | unique | list }}"
  register: _es_keystore_password_tries
  changed_when: false
  failed_when: false
  check_mode: false
  when: _es_keystore_has_passwd.rc | default(1) == 0
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Work out the current keystore password
  ansible.builtin.set_fact:
    _es_keystore_protected: "{{ _es_keystore_has_passwd.rc | default(1) == 0 }}"
    _es_keystore_opened_by: >-
      {{ _es_keystore_password_tries.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Check the keystore password is known
  ansible.builtin.assert:
    that:
      - not (_es_keystore_protected | bool) or _es_keystore_opened_by | length > 0
    fail_msg: >-
      The keystore at {{ _es_keystore_path }} has a password, and neither
      elasticsearch_keystore_password nor elasticsearch_keystore_previous_password opens it. To change
      the password, set elasticsearch_keystore_previous_password to the current one.
    quiet: true

- name: Keystore | Note the current keystore password
  ansible.builtin.set_fact:
    _es_keystore_current_password: "{{ (_es_keystore_opened_by | first) if (_es_keystore_protected | bool) else '' }}"
  no_log: "{{ elasticsearch_no_log }}"

# Changing the password re-encrypts the file but not its entries, so a running
# node does not need a restart; it reads the new passphrase file next time it
# starts.
- name: Keystore | Set, change or remove the keystore password
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - passwd
    # The current password when there is one, then the new one twice
    stdin: "{{ ((_es_keystore_current_password ~ '\n') if (_es_keystore_current_password | string | length) > 0 else '')
      ~ elasticsearch_keystore_password ~ '\n' ~ elasticsearch_keystore_password ~ '\n' }}"
    stdin_add_newline: false
  register: _es_keystore_passwd
  changed_when: true
  when: (_es_keystore_current_password | string) != (elasticsearch_keystore_password | string)
  no_log: "{{ elasticsearch_no_log }}"

# The password the commands below use. In check mode the keystore keeps its
# current password.
- name: Keystore | Use the keystore password
  ansible.builtin.set_fact:
    _es_keystore_cli_password: >-
      {{ _es_keystore_current_password if ansible_check_mode else elasticsearch_keystore_password }}
  no_log: "{{ elasticsearch_no_log }}"

# The packaged service passes this file to Elasticsearch on standard input.
- name: Keystore | Install the keystore passphrase file
  ansible.builtin.copy:
    content: "{{ elasticsearch_keystore_password }}\n"
    dest: "{{ _es_keystore_passphrase_file }}"
    owner: root
    group: elasticsearch
    mode: "0640"
  when: (elasticsearch_keystore_password | string | length) > 0
  no_log: "{{ elasticsearch_no_log }}"
  diff: false

- name: Keystore | Remove an unused keystore passphrase file
  ansible.builtin.file:
    path: "{{ _es_keystore_passphrase_file }}"
    state: absent
  when: (elasticsearch_keystore_password | string | length) == 0

- name: Keystore | List entries
  ansible.builtin.command:
    cmd: "{{ elasticsearch_home }}/bin/elasticsearch-keystore list"
    stdin: "{{ _es_keystore_cli_password if (_es_keystore_cli_password | string | length) > 0 else omit }}"
  register: _es_keystore_list
  changed_when: false
  check_mode: false
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Note the keystore entries
  ansible.builtin.set_fact:
    _es_keystore_entries: "{{ _es_keystore_list.stdout_lines | map('trim') | list }}"

- name: Keystore | Remove security auto-configuration entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - remove
      - "{{ item }}"
    stdin: "{{ _es_keystore_cli_password if (_es_keystore_cli_password | string | length) > 0 else omit }}"
  loop: "{{ _es_autoconfig_keystore_entries | intersect(_es_keystore_entries) }}"
  register: _es_keystore_removed

# post_start.yml removes it once the password is stored in the security index;
# this catches nodes that still have it, such as ones whose first run stopped
# before that. Removing it has no effect on a running node, so unlike other
# keystore changes it does not flag a restart.
- name: Keystore | Remove the bootstrap password once the node has data
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - remove
      - bootstrap.password
    stdin: "{{ _es_keystore_cli_password if (_es_keystore_cli_password | string | length) > 0 else omit }}"
  when:
    - _es_has_data | bool
    - "'bootstrap.password' in (_es_keystore_entries)"

- name: Keystore | Read current values of managed entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - show
      - "{{ item }}"
    stdin: "{{ _es_keystore_cli_password if (_es_keystore_cli_password | string | length) > 0 else omit }}"
  loop: "{{ _es_keystore_desired.keys() | list | intersect(_es_keystore_entries) }}"
  register: _es_keystore_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Add or update managed entries
  ansible.builtin.command:
    argv:
      - "{{ elasticsearch_home }}/bin/elasticsearch-keystore"
      - add
      - --force
      - --stdin
      - "{{ item }}"
    # With a password, it goes on the first line and the value on the second
    stdin: "{{ ((_es_keystore_cli_password ~ '\n') if (_es_keystore_cli_password | string | length) > 0 else '')
      ~ _es_keystore_desired[item] }}"
    stdin_add_newline: false
  loop: "{{ _es_keystore_desired.keys() | list }}"
  when: >-
    (_es_keystore_current.results | default([])
      | selectattr('item', 'equalto', item)
      | selectattr('rc', 'equalto', 0)
      | selectattr('stdout', 'equalto', _es_keystore_desired[item] | string)
      | list | length) == 0
  register: _es_keystore_updated
  no_log: "{{ elasticsearch_no_log }}"

- name: Keystore | Ensure keystore ownership and permissions
  ansible.builtin.file:
    path: "{{ _es_keystore_path }}"
    owner: root
    group: elasticsearch
    mode: "0660"

- name: Keystore | Flag restart for keystore changes
  ansible.builtin.set_fact:
    _es_restart_required: true
  when: _es_keystore_create is changed or _es_keystore_removed is changed or _es_keystore_updated is changed
